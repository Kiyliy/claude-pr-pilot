[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    smoke: basic connectivity and bot reachability
    commands: command response content validation
    github_sync: GitHub <-> TG bidirectional sync (requires GITHUB_TOKEN)
    ai_flow: real AI execution flow, slow (60-180s per test, requires GITHUB_TOKEN)
